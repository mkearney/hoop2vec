  - {name: Las Vegas 2, site: "Las Vegas, NV"}
  - {name: Philadelphia 3, site: "Philadelphia, PA"}
  - {name: Las Vegas 4, site: "Las Vegas, NV"}
final_four_pairs: [[Philadelphia 1, Las Vegas 4], [Las Vegas 2, Philadelphia 3]]
first_round_sites: campus
opening_sites: campus
final_four_site: "Columbus, OH"
