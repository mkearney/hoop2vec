name: pages

# Deploys docs/ to GitHub Pages: the app from main, each league's published data from the site-data branch
# (scripts/site_data.sh), and its latest live data (live.yml) on top wherever that is newer. Page shells, share
# images, team pages and crawl files are built here from that data. Needs Settings -> Pages -> Source: "GitHub Actions".
#
# The live, daily, retrain and backfill workflows call this after they publish. It also runs on pushes to main that
# change docs/ and on pushes to site-data made by hand (a push made by a workflow doesn't start other workflows,
# hence the explicit calls).

on:
  push:
    branches: [main, site-data]
    paths: ["docs/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: hoop2vec-pages   # a newer deploy replaces a waiting one; each deploys the latest main + live data
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main             # the newest commit, including what the calling workflow just pushed
      - name: Published site data (site-data branch)
        run: scripts/site_data.sh pull
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Pillow (share images)
        run: pip install "$(grep -i '^pillow' requirements.txt)"
      - name: Restore live data (mens)
        uses: actions/cache/restore@v5
        with:
          path: live/mens
          key: hoop2vec-live-mens-${{ github.run_id }}
          restore-keys: hoop2vec-live-mens-
      - name: Restore live data (womens)
        uses: actions/cache/restore@v5
        with:
          path: live/womens
          key: hoop2vec-live-womens-${{ github.run_id }}
          restore-keys: hoop2vec-live-womens-
      - name: Restore live data (nba)
        uses: actions/cache/restore@v5
        with:
          path: live/nba
          key: hoop2vec-live-nba-${{ github.run_id }}
          restore-keys: hoop2vec-live-nba-
      - name: Restore live data (wnba)
        uses: actions/cache/restore@v5
        with:
          path: live/wnba
          key: hoop2vec-live-wnba-${{ github.run_id }}
          restore-keys: hoop2vec-live-wnba-
      - name: Put newer live data over the published data
        run: python -m hoop2vec.live overlay
      - name: Page shells, share images and crawl files for the data being deployed
        run: python -m hoop2vec site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      # GitHub sometimes hasn't listed the artifact yet when the deploy asks for it a moment after the upload
      # ("No artifacts named github-pages were found"), and a deploy fails while an earlier one is still running.
      # Both clear up within seconds, so a failed first try gets one more after a short wait.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
