name: daily-refresh

on:
  schedule:
    - cron: "23 10 * * *"   # ~5-6am ET, every day (college Nov-Apr, NBA Oct-Jun, WNBA May-Oct; idle leagues exit early)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hoop2vec-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1          # one league at a time so the commits don't race
      matrix:
        league: [mens, womens, nba, wnba]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data/${{ matrix.league }}
          key: hoop2vec-data-${{ matrix.league }}-${{ github.run_id }}
          restore-keys: hoop2vec-data-${{ matrix.league }}-
      - name: Refresh data, ratings, identities, predictions, bracket (${{ matrix.league }})
        run: python -m hoop2vec daily --${{ matrix.league }}
      - name: Save data cache (even if a later step fails)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/${{ matrix.league }}
          key: hoop2vec-data-${{ matrix.league }}-${{ github.run_id }}
      - name: Commit results
        run: |
          git config user.name "Michael W. Kearney"
          git config user.email "13401460+mkearney@users.noreply.github.com"
          git add docs artifacts/${{ matrix.league }} history/${{ matrix.league }}
          git diff --cached --quiet || git commit -m "Daily refresh (${{ matrix.league }}) $(date -u +%F)"
          git pull --rebase --autostash
          git push
