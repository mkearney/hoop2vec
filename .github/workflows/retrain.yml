name: retrain

on:
  schedule:
    - cron: "41 9 1 * *"      # first of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hoop2vec-refresh
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1          # one league at a time so the commits don't race
      matrix:
        league: [mens, womens, nba, wnba]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Restore data cache
        uses: actions/cache/restore@v5
        with:
          path: data/${{ matrix.league }}
          key: hoop2vec-data-${{ matrix.league }}-${{ github.run_id }}
          restore-keys: hoop2vec-data-${{ matrix.league }}-
      - name: Rebuild features, retrain, rerun the backtests, publish (${{ matrix.league }})
        run: python -m hoop2vec all --${{ matrix.league }}
      - name: Save data cache (even if a later step fails)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/${{ matrix.league }}
          key: hoop2vec-data-${{ matrix.league }}-${{ github.run_id }}
      - name: Commit results
        run: |
          git config user.name "Michael W. Kearney"
          git config user.email "13401460+mkearney@users.noreply.github.com"
          git add docs artifacts/${{ matrix.league }} history/${{ matrix.league }}
          git diff --cached --quiet || git commit -m "Retrain + backtest (${{ matrix.league }}) $(date -u +%F)"
          git pull --rebase --autostash
          git push

  deploy:                      # Pages deploys from Actions (pages.yml): publish what was just committed
    needs: retrain
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
